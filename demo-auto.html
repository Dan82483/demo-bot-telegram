<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Демо-бот: запись в автосервис — прототип</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0e1621; color: #e9edf2; min-height: 100vh;
    font-family: 'Segoe UI', system-ui, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .phone {
    width: 430px; max-width: 100%; height: 860px; max-height: calc(100vh - 48px);
    background: #17212b; border-radius: 22px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    border: 1px solid #24313d;
  }
  .top {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    background: #1c2733; border-bottom: 1px solid #24313d; flex: 0 0 auto;
  }
  .ava {
    width: 40px; height: 40px; border-radius: 50%; flex: 0 0 auto;
    background: linear-gradient(135deg, #4f8cc9, #2b6ca3);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px;
  }
  .who { line-height: 1.25; }
  .who b { font-size: 15px; display: block; }
  .who span { font-size: 12.5px; color: #7d8fa3; }
  .chat { flex: 1 1 auto; overflow-y: auto; padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 84%; padding: 9px 12px; border-radius: 14px; font-size: 14.5px; line-height: 1.45; white-space: pre-line; }
  .bot { background: #212d3b; border-bottom-left-radius: 5px; align-self: flex-start; }
  .me { background: #2b5278; border-bottom-right-radius: 5px; align-self: flex-end; }
  .time { display: block; font-size: 10.5px; color: #7d8fa3; text-align: right; margin-top: 4px; }
  .kb { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; align-self: stretch; }
  .kb button, .reply button {
    font-family: inherit; font-size: 14px; cursor: pointer;
    background: #1e2b38; color: #cfe0f0; border: 1px solid #2b3a49;
    padding: 10px 14px; border-radius: 10px; text-align: center; transition: .15s;
  }
  .kb button:hover, .reply button:hover { background: #253546; border-color: #3b556d; }
  .reply {
    flex: 0 0 auto; display: flex; gap: 6px; flex-wrap: wrap;
    padding: 10px 12px 14px; background: #1c2733; border-top: 1px solid #24313d;
  }
  .reply button { flex: 1 1 auto; font-size: 13px; padding: 9px 10px; }
  .notice {
    font-size: 11.5px; color: #6c7f92; text-align: center; padding: 6px 0 0;
  }
  .typing { align-self: flex-start; background: #212d3b; border-radius: 14px; padding: 12px 14px; display: flex; gap: 5px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #6d8298; display: block; animation: b 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay: .18s } .typing i:nth-child(3) { animation-delay: .36s }
  @keyframes b { 0%,60%,100% { opacity: .35; transform: translateY(0) } 30% { opacity: 1; transform: translateY(-3px) } }
</style>
</head>
<body>

<div class="phone">
  <div class="top">
    <div class="ava">А</div>
    <div class="who">
      <b>Автосервис · запись</b>
      <span>бот · отвечает сразу</span>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="msg bot">Здравствуйте! Это демо-бот автосервиса: записывает на шиномонтаж и ТО без звонков.
 Выберите пункт в меню ниже — всё занимает меньше минуты.<span class="time">10:02</span></div>
  </div>

  <div class="reply" id="reply">
    <button data-act="book">Записаться</button>
    <button data-act="form">Оставить заявку</button>
    <button data-act="prices">Цены</button>
  </div>
  <div class="notice">Прототип интерфейса. Логика соответствует боту на aiogram. Цены — пример.</div>
</div>

<script>
const chat = document.getElementById('chat');
const reply = document.getElementById('reply');
let step = 'idle';

function now() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function scroll() { chat.scrollTop = chat.scrollHeight; }

function add(text, who = 'bot') {
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.innerHTML = text + '<span class="time">' + now() + '</span>';
  chat.appendChild(el);
  scroll();
  return el;
}

function typing() {
  const el = document.createElement('div');
  el.className = 'typing';
  el.innerHTML = '<i></i><i></i><i></i>';
  chat.appendChild(el);
  scroll();
  return el;
}

function botSay(text, delay = 550) {
  const t = typing();
  return new Promise(res => setTimeout(() => {
    t.remove();
    add(text);
    res();
  }, delay));
}

function buttons(items) {
  const wrap = document.createElement('div');
  wrap.className = 'kb';
  items.forEach(([label, handler]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => { wrap.remove(); handler(); };
    wrap.appendChild(b);
  });
  chat.appendChild(wrap);
  scroll();
}

reply.addEventListener('click', async e => {
  const act = e.target.dataset.act;
  if (!act) return;

  if (act === 'prices') {
    add('Цены', 'me');
    await botSay('Ориентиры по ценам:\n• Шиномонтаж, комплект R16 — от 1 500 ₽\n• Замена масла и фильтра — от 500 ₽ (работа)\n• Диагностика ходовой — от 800 ₽\n• Развал-схождение — от 1 200 ₽\n\nТочную сумму назову после осмотра, до начала работ.');
    return;
  }

  if (act === 'book') {
    add('Записаться', 'me');
    await botSay('Выберите удобное время. Свободные слоты на ближайшие дни:');
    buttons([
      ['03.11 в 09:00', () => slotPicked('03.11 в 09:00')],
      ['03.11 в 14:00', () => slotPicked('03.11 в 14:00')],
      ['04.11 в 11:00', () => slotPicked('04.11 в 11:00')],
    ]);
    return;
  }

  if (act === 'form') {
    step = 'name';
    add('Оставить заявку', 'me');
    await botSay('Ничего страшного, если время не подобрать — оставьте заявку, мастер перезвонит.\n\nКак вас зовут?');
    buttons([
      ['Алексей', () => formName('Алексей')],
      ['Марина', () => formName('Марина')],
    ]);
    return;
  }
});

async function slotPicked(slot) {
  add(slot, 'me');
  await botSay('Записал на ' + slot + '.\n\nЧто делаем с машиной?');
  buttons([
    ['Шиномонтаж', () => carAsk(slot, 'Шиномонтаж')],
    ['Замена масла', () => carAsk(slot, 'Замена масла')],
    ['Диагностика ходовой', () => carAsk(slot, 'Диагностика ходовой')],
  ]);
}

async function carAsk(slot, job) {
  add(job, 'me');
  await botSay('Марка и модель машины? Нужно, чтобы понять, есть ли нужные детали в наличии.');
  buttons([['Lada Vesta', () => done(slot, job, 'Lada Vesta')]]);
}

async function done(slot, job, car) {
  add(car, 'me');
  await botSay('Готово:\n' + job + ', ' + car + ', ' + slot + '.\n\nСвободное место занято за вами. Если планы изменятся — напишите здесь, отдам время другому.');
  await botSay('Мастеру ушло уведомление с кнопками «Принять» и «Отклонить» — заявка не потеряется в переписке.', 900);
}

async function formName(name) {
  add(name, 'me');
  await botSay('Телефон для связи? Например, +7 900 000-00-00.\nНужен только чтобы согласовать время.');
  buttons([['+7 912 345-67-89', () => formPhone('+7 912 345-67-89')]]);
}

async function formPhone(phone) {
  add(phone, 'me');
  await botSay('Что нужно сделать? Опишите в двух словах — например, «шиномонтаж, R16, стучит справа».');
  buttons([['Шиномонтаж, R16, стучит справа', () => formDone('Шиномонтаж, R16, стучит справа')]]);
}

async function formDone(task) {
  add(task, 'me');
  await botSay('Принял.\nМастер увидит заявку и свяжется в течение 15 минут в рабочее время.\nЕсли планы изменятся — просто напишите здесь.');
  await botSay('Мастеру ушло уведомление с кнопками «Принять» и «Отклонить» — заявка не потеряется в переписке.', 900);
}
</script>

<script>
// Автопрокрутка диалога для скриншота: demo-auto.html?auto=1
// Кликаем по настоящим кнопкам, чтобы они исчезали как в живом чате.
if (new URLSearchParams(location.search).has('auto')) {
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const clickReply = label => {
    const b = [...reply.querySelectorAll('button')].find(x => x.textContent.includes(label));
    if (b) b.click();
  };
  const clickLastKb = () => {
    const wraps = chat.querySelectorAll('.kb');
    if (!wraps.length) return false;
    const btn = wraps[wraps.length - 1].querySelector('button');
    if (btn) { btn.click(); return true; }
    return false;
  };
  (async () => {
    await wait(400);
    clickReply('Записаться');
    await wait(1400); clickLastKb();      // слот
    await wait(1400); clickLastKb();      // работа
    await wait(1400); clickLastKb();      // марка авто
  })();
}
</script>
</body>
</html>
